[package]
name = "probe-embedded"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
odb-convex-decoder = { path = "../../components/ultrasound/convex-decoder/1.0.1", default-features = false }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
