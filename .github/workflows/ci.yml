name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm run validate
      - run: npm test -w @opendevicedb/core
      - run: npm test -w @opendevicedb/importers
      - run: npm test -w @opendevicedb/mcp
      - run: node --test scripts/*.test.ts
      # The website: a failed build or a broken page must fail the pull request.
      - run: npm run build -w site
      - run: npm run check -w site
