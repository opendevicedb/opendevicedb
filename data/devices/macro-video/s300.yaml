summary: "Dual-lens pan/tilt Wi-Fi camera managed by the V380 Pro app (hardware HsAkQQVL, firmware
  AppEV3L_V2_V1.0.9.10_20250731). Its native LAN protocol on TCP 8800 is documented: login with a
  password envelope, live HEVC video (both lenses stacked in one 640x720 frame) and IMA ADPCM audio
  with their media decryption, pan/tilt, talkback login and configuration reads were exercised on a
  real camera; live settings, SD-card search and replay were recovered statically from the app. The
  camera can be used locally without the phone app or the vendor cloud. Wi-Fi provisioning,
  camera-originated alarm events and the newer port-8089 platform are not covered."
