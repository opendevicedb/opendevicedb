    firmware: V5.01.R02.A64807D7.10010.346732.0000010
    notes: >-
      Owner verified both PTZ axes, white LEDs, speaker beeps and local video on
      one camera. SD persistence and recording observations are summarized in the
      linked validation document. Public ARM/QEMU tests use a simulated backend
