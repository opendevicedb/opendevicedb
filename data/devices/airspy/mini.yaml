    kind: firmware
  - name: Airspy Mini model documentation
    url: https://airspy.com/airspy-mini/
    kind: protocol-doc
install:
  - project: libairspy and host tools
    method: host-software
    guide: https://github.com/airspy/airspyone_host
    difficulty: medium
    notes: >-
      Use the libairspy host installation/build instructions and USB access rules.
      Firmware source availability is recorded separately; this host-software
      route does not flash the receiver.
