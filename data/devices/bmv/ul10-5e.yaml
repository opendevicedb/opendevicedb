status: partial-protocol
summary: Owner-confirmed linear USB probe 04b4:00f1. UL10-5E remains a historical model candidate,
  not read from the current unit. The matching B-mode APK branch documents identity reads,
  command/data/message endpoints and native command framing. Acquisition compatibility and image
  geometry remain unverified; historical pyusbus calls this USB ID CONVEX, which does not establish
  physical geometry.
interfaces:
  - name: Vendor-specific USB acquisition interface
    transport: usb
    status: partial
    confidence: medium
    spec: https://github.com/opendevicedb/opendevicedb/issues/7
    notes: "Descriptors: bulk OUT 01/02/03 and IN 81/82/83, maximum packet 512 bytes, 480 Mb/s. B-mode
      APK SHA256 2317c74a1a1f314bffdc1e5494f87715e153924f40c1c0f7f12883bbdf2bd777, package
      com.animal.www.portableultrasoundimagingsystem, code 3204. Explicit PID 00f1 branch routes OUT
      01 commands, IN 81 data, IN 82 messages. Identity candidates: c0/b0/value 0/index 0/length 8;
      c0/bb/value 3/index 0/length 32; c0/bb/value 3/index 32/length 32; timeout 5000 ms. Historical
      pyusbus uses c3 instead of c0. Native command packet: 512 bytes, four 5a bytes, eight zero
      bytes, up to 124 little-endian u32 words from offset 12, four a5 bytes at offset 508. Start
      word a0020000 and freeze a0010000 are statically identified, not replayed on this unit. Native
      framing candidate uses marker 7fff0000 and line counters; actual geometry and wire sequence
      need an attributed capture. Historical Parquet projection retains command payloads but drops
      the large image-data column; do not treat it as a validated image capture."
