summary: Owner-confirmed BMV linear04b4:00f1 reports UL10-5E/ID7 and version text V1.350. Identity,
  USB paths, configuration producers and B-mode C4/8 line/frame structure are partially mapped. A
  Rust offline parser preserves headers and extracts two signed i8 memory lanes; host command/IN
  coordination is software-tested and a real identity-only preflight sent no OUT. Current-unit image
  acquisition, DSP reconstruction, physical calibration and acoustic stop remain unverified.
interfaces:
  - name: Vendor-specific USB acquisition interface
    transport: usb
    status: partial
    confidence: medium
    spec: https://github.com/opendevicedb/opendevicedb/issues/7
    notes: "Descriptors: bulk OUT 01/02/03 and IN 81/82/83, maximum packet 512 bytes, 480 Mb/s. B-mode
      APK SHA256 2317c74a1a1f314bffdc1e5494f87715e153924f40c1c0f7f12883bbdf2bd777, package
      com.animal.www.portableultrasoundimagingsystem, code 3204. Explicit PID 00f1 branch routes OUT
      01 commands, IN 81 data, IN 82 messages. Identity candidates: c0/b0/value 0/index 0/length 8;
      c0/bb/value 3/index 0/length 32; c0/bb/value 3/index 32/length 32; timeout 5000 ms. Historical
      pyusbus uses c3 instead of c0. Native command packet: 512 bytes, four 5a bytes, eight zero
      bytes, up to 124 little-endian u32 words from offset 12, four a5 bytes at offset 508. Start
      word a0020000 and freeze a0010000 are statically identified, not replayed on this unit. Native
      framing candidate uses marker 7fff0000 and line counters; actual geometry and wire sequence
      need an attributed capture. Historical Parquet projection retains command payloads but drops
      the large image-data column; do not treat it as a validated image capture. Current control-IN
      reads confirm reported text UL10-5E/ID7 and version ASCII V1.350 with two NULs; nine
      exact-length replies identical. Historical packet192(Start)
      SHA25645acfbaf3668222cb5a84eda6727c98a16d6cc976abc8d9332fbb60b48e6dca5 and3679(Freeze)
      SHA256defef81e3822ef8c1377cb80647804b72a647c46787c0ed617ba307291b62b34 match isolated512-byte
      serialization. No current-unit Start/Freeze replay. Static configuration details: Probe
      header24bytes/count@20; PRF column-major; COE8hex/stride10, padded reader blocks128words
      versus USB payload124words; TWave1536bytes per depth. Six active depths govern selection
      despite8PRF rows. StartImageEngine upload phase has13packets for the inspected
      COE128/DTGC-absent configuration; connected UnFreeze with internal flagBC8==0 repeats it then
      Start (14packets). Other UnFreeze branch sends Start only. These are static branches, not a
      measured current-unit trace. XML Vascular-default flag is ignored by Java: remembered exam
      wins, otherwise first SmallParts. No generic ACK or shutdown guarantee established. Static
      B-mode type0/m_nPA0 C4/8 framing: P=selected PRF.col2, N=Probe.focusNum; each line is2*P bytes
      including an8-byte prefix. LE32 marker0x7fff0000 is at0 and full metadata word at4; counter is
      byte5. Frame is2*P*N bytes with every header retained, counters1..N. Confirmation requires the
      next complete line1 header, which is retained for the next frame. Native wrapper waits
      for3*F/2 available bytes; F+8 is a distinct minimal-availability parser policy. Rust strict
      profile requires even P>=4 and N2..255, checked bounded sizes and explicit phase0..3 or
      declared all-phase recovery. The shipped algorithm kernel consumes signed char2 pairs
      beginning at byte8: two i8 memory lanes, not a single LE16 value. Export N*(P-4) pairs without
      asserting all terminal pairs are physically useful. RF/IQ, ADC mapping, sample timing and
      calibration remain unknown. Native software output is a separate W*H uint8 raster with
      palette32; Java live display uses a JNI-filled ARGB_8888 Bitmap sized from the View. Display
      dimensions are not USB sample dimensions. The shipped simulation asset has constant counter33
      and is not a validated C4 cyclic wire fixture."
