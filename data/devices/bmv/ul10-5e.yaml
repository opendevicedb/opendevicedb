status: in-progress
summary: Owner-held BMV linear USB ultrasound probe. UL10-5E model is supported by historical
  vendor-application screenshots, not read from current firmware. Enumerates as Cypress FX3
  04b4:00f1 at USB High Speed with one vendor-specific interface and six bulk endpoints. Existing
  pyusbus lookup calls this USB ID CONVEX, but the owner confirmed this physical unit is linear.
  Commands, sample framing and compatibility remain under investigation.
interfaces:
  - name: Vendor-specific USB acquisition interface
    transport: usb
    status: unknown
    confidence: medium
    spec: https://github.com/opendevicedb/opendevicedb/issues/7
    notes: Observed endpoints OUT 01/02/03 and IN 81/82/83, all bulk, max packet 512 bytes; 480 Mb/s.
      Generic Cypress IDs are not unique model identification. No initialization or acquisition
      attempted. Static aapt2 decoding of android1-animal_PUIS.apk SHA256
      2317c74a1a1f314bffdc1e5494f87715e153924f40c1c0f7f12883bbdf2bd777 shows 04b4:00f1 in
      res/xml/device_filter.xml. Package com.animal.www.portableultrasoundimagingsystem version code
      3204. Native ImageEngineNative entry points and ARM64 USB framing symbols are present. This is
      a VID/PID lead, not demonstrated acquisition compatibility. The older Citrason_en.apk filter
      lists 00f0, not 00f1.
