verification:
  - method: manual
    by: smichea with Codex
    date: 2026-11-04
    notes: Static framing and signed-byte layout were reconstructed from exact B-mode APK
      SHA2562317c74a1a1f314bffdc1e5494f87715e153924f40c1c0f7f12883bbdf2bd777 and its two ARM64
      libraries. A bounded Rust incremental parser preserves all original bytes, headers, invalid
      candidates and EOF tails, and exports two signed lane candidates. It requires explicit
      alignment and availability policies, and invalidates candidates at declared stream gaps.
      Synthetic tests cover fragmentation, counters, resynchronization, gaps, bounds and lane order;
      no current-unit image stream was acquired. A separate direct Linux identity-only driver
      preflight succeeded with39planned command packets all unattempted and interface released; no
      configuration/Start/Freeze sent. Journaled OUT/IN coordination is software-tested only. No
      acoustic stop, reconnect stability, imaging or physical calibration validated. Proprietary
      code/assets, keys, unique serials, personal data and room photos excluded.
  - method: manual
    by: smichea with Codex
    date: 2026-11-04
    notes: New Linux Rust bounded parallel EP81/82 observations used one interface claim, concurrent
      reads, zero received bytes before initialization, and successful release. A separate SIGINT
      test saved both in-flight results, joined readers, released the interface and exited130; this
      is host receive cancellation, not acoustic stop. Static native/DEX analysis resolves Probe.bin
      (24-byte header, count at20), column-major PRF.bin, COE fixed10-byte records with8 hex
      characters and128-word reader padding, and TWave three512-byte blocks per depth. Six UL10-5E
      presets have6 allowed Probe depths but8 PRF rows; Rust rejects extra rows as selectable
      depths. Independent APK checks cover36 preset/depth combinations. Native StartImageEngine
      uploads B-power, AD, ATGC, optional DTGC, depth and TX-line; UnFreeze has reinitializing and
      non-reinitializing branches, and sends Start separately. Missing dtgc_coe_sheet.coe is
      explicit, never replaced with PostDTGC.bin. Pure Rust plans preserve repeated uploads and
      flush boundaries; no configuration or Start/Freeze was sent to the current unit. Java can
      auto-start on recognized ID and also request Start during polling before readiness; its async
      exit does not guarantee Freeze/PowerOFF or cleanup completion. No correlated command
      acknowledgement, image reconstruction, acoustic properties, reconnect stability or validated
      stop is established. Only technical metadata is shared; no unit-unique identifiers or
      proprietary assets/code are included.
  - method: manual
    by: smichea with Codex
    date: 2026-11-04
    notes: Direct Linux Rust identity reads now report UL10-5E, decimal product ID7, and eight
