summary: Owner-held convex USB ultrasound probe of unknown commercial brand/model. Enumerates as
  04b4:4611 with product string EZ-USB FX2 Slave PUIS v1.32 at USB High Speed, one vendor-specific
  interface, three bulk endpoints and one interrupt endpoint. Cypress names the USB controller, not
  a confirmed probe brand; the v1.32 string is not independently verified firmware. Existing pyusbus
  lookup does not select this VID/PID. USB commands and acquisition framing remain unknown.
