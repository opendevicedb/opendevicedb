    notes: "Descriptors: bulk OUT 02, interrupt IN 81 (64 bytes), bulk IN 86/88 (512 bytes), 480 Mb/s;
      Linux corrects interrupt bInterval 0 to 7. PUIS Plus APK SHA256
      237d55266cc6cf84fcda8fbd114bf6f8f97af18007826f0e5c433c877f5e7643, package
      com.itrason.www.PUISColour_32, code 10661. Exact PID 4611 branch: OUT 02 commands, IN 86
      asynchronous data reads of 16384 bytes, IN 88 messages; source also invokes bulkTransfer on
      descriptor-interrupt 81, an unresolved mismatch not to copy blindly. Identity: c0/a6/value
      0/index 0/requested length 8 returned 2 bytes 20 01; explicit observed variant accepts only 2
      or 8 for this query. Product: c0/a9/value 1f00/index 0/32; storage serial: c0/a9/value
      1f20/index 0/32; timeout 5000 ms. Product/storage use FF termination; NUL is preserved. Full
      unique storage serial is omitted publicly. ID 1435 maps to UC5-2S_16, display UC5-2,
      configured label 3.5 MHz, not a measured frequency. App connection automatically calls
      PowerON; identity tool never invoked it. Native PowerON 40/b5 and PowerOFF 40/b4 are
      statically identified, not issued. USB firmware version is not an FPGA logic version; native
      setProcessLogicVer ignores its argument. Receive path reaches DataO::InsertData, whose initial
      mode 1 selects header-driven 32C parsing until settings change; actual captured image format
      is still uncorroborated. Candidate32C extraction supports opaque bytes only; no
      RF/IQ/envelope/pixel type, checksum, footer, line-counter1..N or frame-ID monotonicity is
      established. Mode4 remains unsupported; a following header does not prove a complete frame.
      Constructor99/2 resolves isolated Start/Freeze serialization to wire type2: LE32
      [5a5aa5a5,2,0,0,00060001,0-or-1,2,a5a55a5a] plus480 zero bytes;0=Start,1=Freeze. Internal
      kind99 is not a wire field. Static analysis only; no replay, full initialization or acoustic
      stop validation. Further static PUIS Plus ARM64 analysis establishes the guarded configuration
      lifecycle: path and explicit B parameters precede OpenHW/Run, ATGC/Apo/ApoComp uploads, depth
      re-emission and ScanCtrl; StartImageEngine does not directly invoke SendStartCmd, but Run
      launches a timer that can emit Start independently of UnFreeze. Producer flush calls feed
      per-type buffers, not necessarily USB writes. SendHardMsg can emit implicit Freeze before
      queueing ordinary kinds; type100 bypasses this buffering. After its internal timing threshold,
      the timer can drain buffers then emit optional direct voltage and Start when software frozen
      is false. Transport callback returns are discarded on several paths; neither the timer
      threshold nor caller completion is a complete-configuration barrier or hardware
      acknowledgement. Queues can be popped before Run without sending, and several producer/write
      errors are discarded by native callers. UC5-2S_16 file selectors are TX16/ADC8R, despite the
      folder suffix. B fields, fixed ADC8R and fundamental TxWave8R producers, PRF8 banks and
      bounded upload envelopes are mapped. General upload lengths including framing/alignment
      are1536/2560/2560 bytes for ATGC/Apo/ApoComp; deterministic zero padding is an explicit port
      policy because generic native upload padding state is unproven. The pre-Start direct voltage
      envelope retains a repeated register key. ColorFreeze calls misleadingly named SendStartMsg,
      which emits Freeze value1, not Start. Native PRF depth==count and generic
      file-slice/error-loss quirks require strict bounds in a port. Complete TX/RX focusing/packing,
      filters/up4, hardware logic-version/ScanCtrl, runtime order and acknowledgements remain
      unresolved. No complete convex activation plan or hardware replay is established. Offline Rust
      primitive validation now covers1024 preset/depth/fundamental-index combinations across8
      hash-identified input groups:6144 isolated packet hashes and all selected PRF fields match an
      independent reference. Synthetic tests and strict bounds pass; these are not complete session
      or hardware replay results. Further retained static evidence and offline Rust now cover the
      selected fresh fundamental B TX16/ADC8 non-PA/NEoff branch: depth/frequency/focus TxWave
      selection, convex TX geometry/gates and16x15-bit-delay/aperture packing, B/C RX coefficient
      generation/ADC8 permutation, dynamic IQ/LPF/Boxcar/n/IQ_M, LPF1/Up4, strict HV-SW text
      parsing, depth registers and194ScanCtrl nodes. Twelve local preset files plus selected HV0
      must match one complete known hash group; all eight inspected presets share the five newly
      mapped TX/filter/Up4/BF files. No vendor payload is embedded or exported. TX uses binary32
      geometry followed by binary64 signed0.5/trunc; RX rounding stays binary32, with checked
      integer/halfword bounds. ScanCtrl TX/version fields are offsets124/128, not11c/120. Full logic
      version and low-power originate from hardware message LE32+8 and (LE16+500&6)>>1 through
      Java/JNI, not USB firmware1.32. Actual values are still unknown. The native ScanCtrl
      control-event count is assigned1, yielding denominator97-1=96, despite194total nodes. Direct
      review refines the provisional low-power condition: when disable=false and lowPower!=2,
      lowPower1 selects the branch directly; other values including3 follow the TX16
      product-series5..21/29 condition. An offline request must explicitly declare logic/low-power
      and fresh-B state.13producer families are materialized as fingerprinted candidates, not an
      executable lifecycle: kind100 activation is immediate, registers are deduplicated with an
      explicitly adapted ascending-address order, and direct voltage preserves its repeated key.
      Native implicit Freeze/timer Start remain distinct; no timer-completion barrier or ACK is
      inferred.1344cases (8presets x8depths x3frequencies x7focuses) match17472complete padded
      packet SHA256 fingerprints against an independent scalar reference, covering35782656bytes.
      Host libm is shared; no ARM/vendor-runtime equivalence or hardware replay.216common tests
      pass. Callback side effects, actual logical state, lifecycle executor, transfer timing/order,
      error/partial-write recovery, attributed imaging and acoustic/electrical validation remain
      open."
