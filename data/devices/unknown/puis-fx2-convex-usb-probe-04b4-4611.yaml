      separate0x0c00 session is refused before configuration/Start. Successful sessions use
      identical19OUT payloads and bounded RAM receive. Observed global headers are1024bytes,
      mode0/P896/N32; selected groups retain32lines of7200bytes. Final9/36image counts differ from
