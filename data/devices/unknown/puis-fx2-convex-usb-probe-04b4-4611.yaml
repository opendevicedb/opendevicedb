    spec: https://github.com/opendevicedb/opendevicedb/issues/8
    notes: "Descriptors: bulk OUT 02, interrupt IN 81 (64 bytes), bulk IN 86/88 (512 bytes), 480 Mb/s;
      Linux corrects interrupt bInterval 0 to 7. PUIS Plus APK SHA256
      237d55266cc6cf84fcda8fbd114bf6f8f97af18007826f0e5c433c877f5e7643, package
      com.itrason.www.PUISColour_32, code 10661. Exact PID 4611 branch: OUT 02 commands, IN 86
      asynchronous data reads of 16384 bytes, IN 88 messages; source also invokes bulkTransfer on
      descriptor-interrupt 81, an unresolved mismatch not to copy blindly. Identity: c0/a6/value
      0/index 0/requested length 8 returned 2 bytes 20 01; explicit observed variant accepts only 2
      or 8 for this query. Product: c0/a9/value 1f00/index 0/32; storage serial: c0/a9/value
      1f20/index 0/32; timeout 5000 ms. Product/storage use FF termination; NUL is preserved. Full
      unique storage serial is omitted publicly. ID 1435 maps to UC5-2S_16, display UC5-2,
      configured label 3.5 MHz, not a measured frequency. App connection automatically calls
      PowerON; identity tool never invoked it. Native PowerON 40/b5 and PowerOFF 40/b4 are
      statically identified, not issued. USB firmware version is not an FPGA logic version; native
      setProcessLogicVer ignores its argument. Receive path reaches DataO::InsertData, whose initial
      mode 1 selects header-driven 32C parsing until settings change; actual captured image format
      is still uncorroborated. Candidate32C extraction supports opaque bytes only; no
      RF/IQ/envelope/pixel type, checksum, footer, line-counter1..N or frame-ID monotonicity is
      established. Mode4 remains unsupported; a following header does not prove a complete frame.
      Constructor99/2 resolves isolated Start/Freeze serialization to wire type2: LE32
      [5a5aa5a5,2,0,0,00060001,0-or-1,2,a5a55a5a] plus480 zero bytes;0=Start,1=Freeze. Internal
      kind99 is not a wire field. Static analysis only; no replay, full initialization or acoustic
      stop validation."
