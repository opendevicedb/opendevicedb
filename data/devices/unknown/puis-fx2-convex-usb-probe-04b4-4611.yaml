    notes: "Observed endpoints: OUT02 commands, IN86 DATA with 16384-byte host requests, IN88 messages
      with 512-byte host requests, interrupt IN81. Targeted control-IN reports UC5-2S/1435 while
      message PID0 retains raw ID0/connection0; the tested controller rechecks identity on the same
