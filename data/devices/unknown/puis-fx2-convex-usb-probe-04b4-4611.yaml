    confidence: medium
    spec: https://github.com/opendevicedb/opendevicedb/issues/8
    notes: "Observed bulk OUT 02, interrupt IN 81 (64 bytes), bulk IN 86/88 (512 bytes), 480 Mb/s. Raw
      bInterval=0 on interrupt endpoint is corrected to 7 by Linux. Historical PUIS archive contains
      a generic Cypress driver matching this ID, which does not prove application compatibility.
      Static aapt2 decoding of Citrason_PUIS_Plus.apk SHA256
      237d55266cc6cf84fcda8fbd114bf6f8f97af18007826f0e5c433c877f5e7643 shows 04b4:4611 in
      res/xml/device_filter.xml. Package com.itrason.www.PUISColour_32 version code 10661. This is a
      VID/PID lead, not demonstrated acquisition compatibility. Do not select the first IN endpoint
      blindly: it is interrupt 81, whereas bulk IN endpoints are 86/88. PUIS Plus exposes
      jni.USB_JNI callbacks for probe connection, data and messages. Endpoint routing for PID 4611
      has not yet been traced; roles must not be transferred from another PID branch."
